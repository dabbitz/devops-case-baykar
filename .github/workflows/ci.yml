name: DevOps Case CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mern-project/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: mern-project/client
        run: npm ci

      - name: Build frontend
        working-directory: mern-project/client
        run: npm run build

      # Backend
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mern-project/server/package-lock.json

      - name: Install backend dependencies
        working-directory: mern-project/server
        run: npm ci

      - name: Validate backend
        working-directory: mern-project/server
        run: node --check server.mjs

      # Python ETL
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ETL dependencies
        working-directory: python-project
        run: pip install -r requirements.txt

      - name: Validate ETL syntax
        working-directory: python-project
        run: python -m py_compile ETL.py

      # Docker build validation
      - name: Build backend image
        run: docker build -t devops-case-backend:ci ./mern-project/server

      - name: Build frontend image
        run: docker build --build-arg REACT_APP_API_URL=/api -t devops-case-frontend:ci ./mern-project/client

      - name: Build ETL image
        run: docker build -t devops-case-etl:ci ./python-project

      # Container security scanning
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devops-case-backend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devops-case-frontend:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan ETL image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devops-case-etl:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-eks:
    name: Deploy to AWS EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-central-1
      EKS_CLUSTER: devops-case-eks
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Debug OIDC claims
        shell: bash
        run: |
          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)

          echo "OIDC sub:"
          echo "$PAYLOAD" | jq -r '.sub'

          echo "OIDC aud:"
          echo "$PAYLOAD" | jq -r '.aud'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-EKS-Deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set ECR registry
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/devops-case-backend:$IMAGE_TAG" \
            ./mern-project/server

      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=/api \
            -t "$ECR_REGISTRY/devops-case-frontend:$IMAGE_TAG" \
            ./mern-project/client

      - name: Build ETL image
        run: |
          docker build \
            -t "$ECR_REGISTRY/devops-case-etl:$IMAGE_TAG" \
            ./python-project

      - name: Push images to ECR
        run: |
          docker push "$ECR_REGISTRY/devops-case-backend:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/devops-case-frontend:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/devops-case-etl:$IMAGE_TAG"

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify EKS access
        run: |
          kubectl get deployments -n devops-case

      - name: Update Kubernetes secrets
        env:
          ATLAS_URI: ${{ secrets.ATLAS_URI }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          kubectl create secret generic backend-secret \
            --namespace devops-case \
            --from-literal=ATLAS_URI="$ATLAS_URI" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic etl-secret \
            --namespace devops-case \
            --from-literal=GITHUB_TOKEN="$GITHUB_TOKEN" \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Validate and apply production Kustomize overlay
        run: |
          kubectl apply --dry-run=server -k k8s/overlays/prod
          kubectl apply -k k8s/overlays/prod

      - name: Update deployed image versions
        run: |
          kubectl set image deployment/backend \
            backend="$ECR_REGISTRY/devops-case-backend:$IMAGE_TAG" \
            -n devops-case

          kubectl set image deployment/frontend \
            frontend="$ECR_REGISTRY/devops-case-frontend:$IMAGE_TAG" \
            -n devops-case

          kubectl set image cronjob/etl \
            etl="$ECR_REGISTRY/devops-case-etl:$IMAGE_TAG" \
            -n devops-case

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/backend \
            -n devops-case \
            --timeout=180s

          kubectl rollout status deployment/frontend \
            -n devops-case \
            --timeout=180s

      - name: Verify workloads
        run: |
          kubectl get pods -n devops-case -o wide
          kubectl get services -n devops-case
          kubectl get cronjob -n devops-case
          kubectl get gateway -n devops-case
          kubectl get httproute -n devops-case

      - name: Verify backend health
        shell: bash
        run: |
          for i in {1..30}; do
            GATEWAY_HOST=$(kubectl get gateway devops-gateway \
              -n devops-case \
              -o jsonpath='{.status.addresses[0].value}' 2>/dev/null || true)

            if [ -n "$GATEWAY_HOST" ]; then
              echo "Gateway: $GATEWAY_HOST"

              if curl --silent --show-error --fail \
                "http://$GATEWAY_HOST/api/healthcheck"; then
                echo
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Backend health check failed"
          exit 1

      - name: Verify frontend
        shell: bash
        run: |
          GATEWAY_HOST=$(kubectl get gateway devops-gateway \
            -n devops-case \
            -o jsonpath='{.status.addresses[0].value}')

          curl --silent --show-error --fail \
            "http://$GATEWAY_HOST/"

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully."
          echo "Commit: $GITHUB_SHA"
          kubectl get deployments -n devops-case
          kubectl get pods -n devops-case