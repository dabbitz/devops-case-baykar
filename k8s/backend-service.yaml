apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devops-case
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5050
      targetPort: 5050
    
  env:
  - name: ATLAS_URI
    valueFrom:
      secretKeyRef:
        name: backend-secret
        key: ATLAS_URI
        
  type: ClusterIP