apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-case

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: devops-case-backend:k8s
          imagePullPolicy: Never

          ports:
            - containerPort: 5050

          env:
            - name: ATLAS_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ATLAS_URI