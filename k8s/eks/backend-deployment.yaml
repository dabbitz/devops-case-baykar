apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-case

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 203309795174.dkr.ecr.eu-central-1.amazonaws.com/devops-case-backend:eks
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 5050

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /healthcheck/
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthcheck/
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10

          env:
            - name: ATLAS_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ATLAS_URI
