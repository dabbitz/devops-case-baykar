apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-case

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 203309795174.dkr.ecr.eu-central-1.amazonaws.com/devops-case-backend:eks
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 5050

          env:
            - name: ATLAS_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ATLAS_URI
