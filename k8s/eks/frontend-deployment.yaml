apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: devops-case

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 203309795174.dkr.ecr.eu-central-1.amazonaws.com/devops-case-frontend:eks
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
